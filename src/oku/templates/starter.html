<!--
  oku starter — per-page HTML stub.

  Pair with a sibling {{ NAME }}.md (start from templates/starter.md).
  The build / dev server synthesize the page JSON from the markdown
  source; the renderer fetches it at load time and builds the page.

  Re-use verbatim for every new page; the only per-page bit is the
  <title>. Body skeleton, font loading, and autoBoot are owned by the
  kit's CSS and JS — leave <body> empty.

  Quick start:
    1. Copy this file as <my-page>.html
    2. Copy templates/starter.md as <my-page>.md
    3. Edit <my-page>.md — fill the {{ }} placeholders
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ TITLE }}</title>
<script src="_oku/chrome-boot.js"></script>
<link rel="stylesheet" href="_oku/chrome.css">
<script src="_oku/chrome.js" defer></script>
<script src="_oku/renderer.js" defer></script>
</head>
<body></body>
</html>
