<!--
  oku starter — per-page HTML stub.

  Pair with a sibling {{ NAME }}.json (start from templates/starter.json).
  The renderer fetches the JSON at load time and builds the page from it.

  Re-use verbatim for every new page; the only per-page bit is the
  <title>. Body skeleton, font loading, and autoBoot are owned by the
  kit's CSS and JS — leave <body> empty.

  Quick start:
    1. Copy this file as <my-page>.html
    2. Copy templates/starter.json as <my-page>.json
    3. Edit <my-page>.json — fill the {{ }} placeholders
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ TITLE }}</title>
<script src="_kit/chrome-boot.js"></script>
<link rel="stylesheet" href="_kit/chrome.css">
<script src="_kit/chrome.js" defer></script>
<script src="_kit/renderer.js" defer></script>
</head>
<body></body>
</html>
