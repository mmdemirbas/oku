name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --extra dev

      # Whole repo, not just src/ — a future script or tool at the root
      # is still Python this project owns.
      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Doctree check (strict)
        run: uv run oku check --strict

      - name: Build
        run: uv run oku build

      - name: Install chromium for browser tests
        run: uv run playwright install --with-deps chromium

      # OKU_REQUIRE_BROWSER makes the browser package FAIL instead of
      # skip when chromium is missing. Without it a broken install turns
      # the whole UI suite into silent skips and CI still reports green.
      - name: Tests (incl. browser invariants)
        env:
          OKU_REQUIRE_BROWSER: "1"
        run: uv run pytest -q
