name: pages

# Publishes two things to https://mmdemirbas.github.io/oku/: the landing page
# in site/ at the root (plain static HTML, generated from a spec by
# atolye/bin/web/landing/build.py and committed, plus one redirect stub per
# documentation page at its old root address), and the documentation built by
# the kit itself under docs/. Independent of ci.yml on purpose: a red browser
# test must not take the published docs down.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies (with the search extra, so Pagefind indexes the site)
        run: uv sync --extra search

      - name: Build the docs tree from inside docs/
        # From the repo root the build writes ./dist and walks the whole
        # tree; the site lives in docs/dist/site only when built from docs/.
        working-directory: docs
        run: uv run oku build

      - name: Assemble the site — landing at the root, documentation under docs/
        run: |
          mkdir -p out/docs
          cp -R site/. out/
          cp -R docs/dist/site/. out/docs/
          # Keep every _oku/ asset (Pages skips underscore paths only under Jekyll; this makes it explicit)
          touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # The action's first move is to exchange the job's OIDC token, and that
      # request times out on the runner every so often ("Failed to get ID
      # Token ... Request timeout"), which fails the deploy while the build is
      # perfectly good. Nothing is published before the token, so a second
      # attempt is safe; it runs only when the first one failed.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
