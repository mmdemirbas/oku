[project]
# Project name is `oku` (Turkish imperative "read!"). Package lives
# at src/oku/.
name = "oku"
version = "0.6.5"
description = "oku — shared HTML chrome kit + CLI. Standalone, theme-aware visual docs without a build step."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muhammed" }]
license = { text = "MIT" }
keywords = ["oku", "html", "docs", "static-site", "documentation"]

# Runtime stays optional — the script tolerates a missing jsonschema
# (validation is skipped, build still succeeds). uv-driven invocations
# pull it in automatically via the PEP 723 inline metadata in
# `bin/oku`; install-time users can opt in via the `schema` extra.
# jsonschema is NOT optional. It was, and the consequence was a page
# that `oku check` called clean while three of its blocks rendered as
# blank space — the installed tool had no jsonschema, so the schema
# pass silently no-opped and only the structural checks ran. A check
# that reports success when it did not run is worse than no check.
dependencies = ["jsonschema>=4.0"]

[project.optional-dependencies]
# Kept so an existing `oku[schema]` install keeps resolving; the
# dependency itself moved to the base set above.
schema = ["jsonschema>=4.0"]
# Pagefind ships its own Rust binary inside the `pagefind[bin]` PyPI
# extra — no brew / npm / npx needed. cli.py prefers `python -m
# pagefind` over the system binary so an `oku[search]` install gives
# users a self-contained search build out of the box.
search = ["pagefind[bin]>=1.5"]
dev = [
    "jsonschema>=4.0",
    "pagefind[bin]>=1.5",
    "ruff>=0.5",
    "pytest>=7.0",
    # Browser-level regression tests under src/oku_tests/browser/ —
    # they auto-skip when the chromium binary isn't installed
    # (`playwright install chromium` to enable).
    "pytest-playwright>=0.5",
]

[project.urls]
Homepage = "https://github.com/mmdemirbas/oku"

# `uv tool install .` (or `pip install .`) installs this as a console
# script — `oku` becomes available on PATH globally.
[project.scripts]
oku = "oku.cli:main"

# Hatchling is the modern PEP 517 build backend — smaller surface than
# setuptools, no implicit globbing, fast wheel builds. Build-time only;
# does not appear at runtime for end users.
[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oku"]

# Pack the kit's runtime assets + shared registries (schema, glossary,
# extrefs) under oku/assets/ in the installed wheel. The dev layout at
# <repo>/kit/ mirrors the same shape; _kit_assets_dir() in cli.py
# selects whichever exists.
[tool.hatch.build.targets.wheel.force-include]
"kit/chrome.css"      = "oku/assets/chrome.css"
"kit/chrome.js"       = "oku/assets/chrome.js"
"kit/chrome-boot.js"  = "oku/assets/chrome-boot.js"
"kit/renderer.js"     = "oku/assets/renderer.js"
"kit/schema"          = "oku/assets/schema"
"kit/glossary"        = "oku/assets/glossary"
"kit/extrefs"         = "oku/assets/extrefs"
"kit/i18n"            = "oku/assets/i18n"

[tool.hatch.build.targets.sdist]
include = [
    "src/oku",
    "bin/oku",
    "kit/",
    "README.md",
]
# Every `_oku` is a symlink to ../kit — `oku init` drops one beside each
# page directory, and this repo has three. hatchling dedupes directories
# by (st_dev, st_ino) as it walks, and `docs` and `examples` both sort
# before `kit`, so the kit's real inode was consumed under a name that
# matches no include pattern; `kit/` was then skipped as already seen.
# The include spec said yes to `kit/chrome.js` the whole time — the walk
# simply never offered it. The sdist shipped 9 files with no kit asset
# among them, and `uv build` then failed on the wheel it builds FROM
# that sdist: "Forced include not found: kit/chrome-boot.js".
#
# The glob rather than the two names: a fourth page directory gets an
# `_oku` on the day someone runs `oku init` in it, and a release that
# breaks then would be traced back to this file with nothing here
# saying why.
exclude = ["**/_oku"]
skip-excluded-dirs = true

[tool.uv]
managed = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["src/oku_tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "browser: headless-chromium UI-invariant tests (skip with -m 'not browser')",
]

[dependency-groups]
dev = [
    "tiktoken>=0.13.0",
]
