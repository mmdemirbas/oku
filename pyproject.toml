[project]
name = "html-doc"
version = "0.2.0"
description = "Shared HTML chrome kit + CLI. Standalone, theme-aware visual docs without a build step."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Muhammed" }]
license = { text = "MIT" }
keywords = ["html", "docs", "static-site", "documentation"]

# Runtime stays optional — the script tolerates a missing jsonschema
# (validation is skipped, build still succeeds). uv-driven invocations
# pull it in automatically via the PEP 723 inline metadata in
# `bin/html-doc`; install-time users can opt in via the `schema` extra.
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]
dev = [
    "jsonschema>=4.0",
    "ruff>=0.5",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/mmdemirbas/html-doc"

# `uv tool install .` (or `pip install .`) installs this as a console
# script — `html-doc` becomes available on PATH globally.
[project.scripts]
html-doc = "html_doc.cli:main"

# Hatchling is the modern PEP 517 build backend — smaller surface than
# setuptools, no implicit globbing, fast wheel builds. Build-time only;
# does not appear at runtime for end users.
[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/html_doc"]

# Pack the kit assets under html_doc/assets/ in the installed wheel so
# cli._kit_assets_dir() finds them on PATH-installed deployments. The
# dev layout (chrome.css at repo root) keeps working — the helper picks
# whichever exists.
[tool.hatch.build.targets.wheel.force-include]
"chrome.css"      = "html_doc/assets/chrome.css"
"chrome.js"       = "html_doc/assets/chrome.js"
"chrome-boot.js"  = "html_doc/assets/chrome-boot.js"
"renderer.js"     = "html_doc/assets/renderer.js"
"schema"          = "html_doc/assets/schema"
"glossary"        = "html_doc/assets/glossary"
"extrefs"         = "html_doc/assets/extrefs"
"templates"       = "html_doc/assets/templates"

[tool.hatch.build.targets.sdist]
include = [
    "src/html_doc",
    "bin/html-doc",
    "chrome.css",
    "chrome.js",
    "chrome-boot.js",
    "renderer.js",
    "schema/",
    "glossary/",
    "extrefs/",
    "templates/",
    "README.md",
    "CHANGELOG.md",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
