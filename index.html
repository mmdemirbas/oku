<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>html-doc</title>
<!--
  Repo-root entry point. Lets a static server (IntelliJ's built-in
  HTTP server on :63342, `python -m http.server`, GitHub Pages from
  the repo root, etc.) serve the docs site without running
  `html-doc serve`. Forwards the IntelliJ `_ijt` token through to the
  docs index so internal asset URLs keep their auth.

  Plain HTML — no kit assets needed. Lightweight by design.
-->
<script>
  (function () {
    try {
      var ijt = (location.search.match(/[?&]_ijt=([^&]+)/) || [])[1];
      var target = 'docs/index.html' + (ijt ? '?_ijt=' + ijt : '');
      location.replace(target);
    } catch (e) {
      // Fall through to the <a> below if JS is disabled or location
      // replace fails for some reason.
    }
  })();
</script>
<meta http-equiv="refresh" content="0;url=docs/index.html">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI",
         Inter, sans-serif; background: #f8f9fb; color: #1a1f36; }
  main { text-align: center; padding: 24px; }
  a { color: #4338ca; text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  p { color: #4b5563; margin: 8px 0 0; font-size: 14px; }
  @media (prefers-color-scheme: dark) {
    body { background: #0e0c1c; color: #d3d4e0; }
    a { color: #818cf8; }
    p { color: #8b85a3; }
  }
</style>
</head>
<body>
<main>
  <a href="docs/index.html">Open html-doc docs &rarr;</a>
  <p>Redirecting to <code>docs/index.html</code>&hellip;</p>
</main>
</body>
</html>
