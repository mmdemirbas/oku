# The platform ships its own Kotlin stdlib; a second copy in the plugin
# is the classic source of ClassCastException across loaders.
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
# Where the PoC compiles and runs against: the IDE already on this machine,
# so nothing is downloaded. Override with -PideaPath=…
ideaPath=/Users/md/Applications/IntelliJ IDEA.app
